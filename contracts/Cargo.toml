[workspace]
members = [
    "shared",
    "bond-issuer",
    "coupon-engine",
    "oracle-consumer",
    "dex-router",
    "project-registry",
    "credit-retirement",
    "governance",
    "tests",
    "storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
